name: build-exe
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pygame pillow pyinstaller pycaw comtypes
      - shell: bash
        run: |
          args=""
          for f in *.jpg *.jpeg *.png *.mp3; do
            [ -f "$f" ] && args="$args --add-data $f;."
          done
          pyinstaller --onefile --noconsole --hidden-import comtypes --hidden-import pycaw $args --name ARTUR artur.py
      - uses: actions/upload-artifact@v4
        with:
          name: ARTUR-exe
          path: dist/ARTUR.exe
